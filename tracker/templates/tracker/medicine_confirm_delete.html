{% extends 'base.html' %}

{% block content %}
<h2>Delete Medicine</h2>
<p>Are you sure you want to delete <strong>{{ medicine.name }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'medicine_list' %}">Cancel</a>
</form>
{% endblock %}
