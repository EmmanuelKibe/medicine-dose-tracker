{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl border border-rose-200 dark:border-rose-950/50 animate-fade-in mt-6 text-center">
    <div class="w-16 h-16 bg-rose-100 dark:bg-rose-950/50 text-rose-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
        🗑️
    </div>
    
    <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 mb-2">Delete Medicine?</h2>
    <p class="text-sm text-slate-600 dark:text-slate-300 mb-6">
        Are you sure you want to delete <strong class="text-slate-900 dark:text-slate-100">{{ medicine.name }}</strong>? This action cannot be undone.
    </p>

    <form method="post" class="flex items-center justify-center space-x-3">
        {% csrf_token %}
        <button type="submit" class="py-2.5 px-5 bg-rose-600 hover:bg-rose-700 text-white font-medium rounded-lg shadow-md shadow-rose-500/20 transition-all hover:scale-[1.02] active:scale-[0.98]">
            Yes, Delete
        </button>
        <a href="{% url 'medicine_list' %}" class="py-2.5 px-5 bg-slate-100 dark:bg-gray-700 text-slate-600 dark:text-slate-300 text-sm font-medium rounded-lg hover:bg-slate-200 dark:hover:bg-gray-600 transition-colors">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
