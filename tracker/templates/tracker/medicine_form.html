{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl border border-slate-200 dark:border-gray-700 animate-fade-in mt-6">
    <div class="flex items-center space-x-3 mb-6">
        <span class="text-3xl">✏️</span>
        <div>
            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">Edit Medicine</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">Update prescription info for <strong>{{ medicine.name }}</strong></p>
        </div>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">
                    {{ field.label }}
                </label>
                {{ field }}
            </div>
        {% endfor %}
        
        <div class="flex items-center space-x-3 pt-2">
            <button type="submit" class="flex-1 py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-md shadow-emerald-500/20 transition-all hover:scale-[1.02] active:scale-[0.98]">
                Update Medicine
            </button>
            <a href="{% url 'medicine_list' %}" class="px-4 py-2.5 bg-slate-100 dark:bg-gray-700 text-slate-600 dark:text-slate-300 text-sm font-medium rounded-lg hover:bg-slate-200 dark:hover:bg-gray-600 transition-colors">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
