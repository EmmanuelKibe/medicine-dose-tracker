{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl border border-slate-200 dark:border-gray-700 animate-fade-in mt-6">
    <div class="text-center mb-6">
        <span class="text-4xl">🔑</span>
        <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100 mt-2">Welcome Back</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400">Log in to manage your daily medical prescriptions.</p>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">
                    {{ field.label }}
                </label>
                {{ field }}
            </div>
        {% endfor %}
        <button type="submit" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-md shadow-emerald-500/20 transition-all hover:scale-[1.02] active:scale-[0.98]">
            Log In
        </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500">
        Don't have an account yet? <a href="{% url 'signup' %}" class="text-emerald-600 font-semibold hover:underline">Sign up now</a>
    </div>
</div>
{% endblock %}
