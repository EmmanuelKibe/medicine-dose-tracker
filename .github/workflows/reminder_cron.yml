name: Send Medicine Reminders Cron

on:
  schedule:
    # Runs every 15 minutes (UTC)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Medicine Reminders Endpoint
        run: |
          curl -s "https://medtrack-app.onrender.com/api/cron/send-reminders/?secret=${{ secrets.CRON_SECRET }}"